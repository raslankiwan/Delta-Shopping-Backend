  }
}

query Orders($status: String, $limit: Int) {
  orders(status: $status, limit: $limit) {
    id
    number
    email
    currency
    status
    financial_status
    fulfillment_status
    total_minor
    placed_at
  }
}

query Order($id: String!) {
  order(id: $id) {
    order {
      id
      number
      email
      currency
      status
      financial_status
      fulfillment_status
      subtotal_minor
      tax_minor
      shipping_minor
      total_minor
      placed_at
    }
    lines {
      sku
      title
      quantity
      unit_price_minor
      total_minor
    }
    payments {
      provider
      status
      amount_minor
    }
    fulfillments {
      status
      tracking_number
      carrier
    }
    refunds {
      amount_minor
      reason
      status
    }
  }
}

mutation CancelOrder($id: String!) {
  cancelOrder(id: $id)
}

mutation RefundOrder($id: String!, $input: RefundOrderInput!) {
  refundOrder(id: $id, input: $input) {
    id
  }
}

mutation FulfillOrder($id: String!, $input: FulfillOrderInput!) {
  fulfillOrder(id: $id, input: $input) {
    id
  }
}

