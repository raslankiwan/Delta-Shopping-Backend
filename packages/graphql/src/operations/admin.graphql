fragment PrincipalF on PrincipalType {
  user_id
  organization_id
  store_ids
  permissions
}

fragment AuthPayloadF on AuthPayloadType {
  access_token
  refresh_token
  token_type
  expires_in
  principal {
    ...PrincipalF
  }
}

mutation StaffLogin($input: LoginInputType!) {
  staffLogin(input: $input) {
    ...AuthPayloadF
  }
}

mutation StaffRegister($input: SignupInputType!) {
  staffRegister(input: $input) {
    ...AuthPayloadF
  }
}

mutation RefreshToken($input: RefreshInputType!) {
  refreshToken(input: $input) {
    ...AuthPayloadF
  }
}

mutation Logout($input: RefreshInputType!) {
  logout(input: $input)
}

query Me {
  me {
    ...PrincipalF
  }
}

query AdminProducts {
  adminProducts {
    id
    slug
    title
    status
  }
}

query AdminProduct($id: String!) {
  adminProduct(id: $id) {
    id
    slug
    title
    subtitle
    description
    type
    requires_shipping
    service_duration_minutes
    service_location
    category {
      id
      slug
      name
    }
    vendor
    tags
    seo_title
    seo_description
    status
    translations
    images {
      id
      url
      alt
      position
    }
    options {
      name
      values
    }
    variants {
      id
      sku
      option_values
      price {
        amount_minor
        currency
      }
      compare_at {
        amount_minor
        currency
      }
    }
  }
}

query AdminPriceLists {
  adminPriceLists {
    id
    name
    currency
  }
}

query AdminCategories {
  adminCategories {
    id
    slug
    name
    parent_id
    position
  }
}

mutation CreateCategory($input: CreateCategoryInput!) {
  createCategory(input: $input) {
    id
  }
}

query AdminShippingZones {
  shippingZones {
    id
    governorate
    name
    rate {
      amount_minor
      currency
    }
    cod_available
    eta_days
    enabled
  }
}

mutation CreateProduct($input: CreateProductInput!) {
  createProduct(input: $input) {
    id
  }
}

mutation UpdateProduct($id: String!, $input: UpdateProductInput!) {
  updateProduct(id: $id, input: $input)
}

mutation DeleteProduct($id: String!) {
  deleteProduct(id: $id)
}

mutation AddProductOption($productId: String!, $input: AddOptionInput!) {
  addProductOption(productId: $productId, input: $input) {
    id
  }
}

mutation GenerateVariants($productId: String!) {
  generateVariants(productId: $productId) {
    created
  }
}

mutation AddProductImage($productId: String!, $input: AddImageInput!) {
  addProductImage(productId: $productId, input: $input) {
    id
  }
}

mutation RemoveProductImage($imageId: String!) {
  removeProductImage(imageId: $imageId)
}

mutation SetProductTranslations($productId: String!, $input: SetTranslationsInput!) {
  setProductTranslations(productId: $productId, input: $input)
}

mutation SetVariantPrice($variantId: String!, $input: SetPriceInput!) {
  setVariantPrice(variantId: $variantId, input: $input) {
    id
  }
}

mutation MediaUpload($filename: String!, $contentBase64: String!) {
  mediaUpload(filename: $filename, contentBase64: $contentBase64) {
    url
    filename
    size
  }
}

query Inventory {
  inventory {
    variant_id
    sku
    location_id
    on_hand
    reserved
    reorder_point
    available
  }
}

query InventoryLowStock {
  inventoryLowStock {
    variant_id
    sku
    on_hand
    reserved
    reorder_point
  }
}

mutation InventoryAdjust($input: AdjustInventoryInput!) {
  inventoryAdjust(input: $input) {
