# Mercato CI
#
# Forward-only pipeline: install, typecheck, lint, test (Turborepo fans each
# task out across the workspace). Runs against a real Postgres 18 service
# container so the RLS cross-tenant isolation test (packages/db) has
# something to talk to — same two-role model (app_owner / app_user) as local
# dev, bootstrapped from infra/postgres/init/00-roles.sql before migrations.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Application role: subject to RLS, no BYPASSRLS. What the API/tests use
  # for ordinary tenant-scoped traffic.
  DATABASE_URL: postgres://app_user:app_pass@localhost:5432/mercato
  # Privileged role: BYPASSRLS. Used only by migrations and the isolation
  # test harness itself to set up/inspect cross-tenant state.
  DATABASE_ADMIN_URL: postgres://app_owner:owner_pass@localhost:5432/mercato
  REDIS_URL: redis://localhost:9003
  NODE_ENV: test

jobs:
  test:
    name: typecheck / lint / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mercato
        ports:
          # host 5432 -> container 5432, matching infra/docker-compose.yml
          # so DATABASE_URL/DATABASE_ADMIN_URL above work unchanged locally
          # and in CI.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mercato"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 9003:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      # oven-sh/setup-bun doesn't have a built-in cache flag; cache Bun's
      # global install cache keyed on the lockfile so `bun install` is fast
      # on unchanged dependencies.
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Docker's ${POSTGRES_*} entrypoint only runs docker-entrypoint-initdb.d
      # on first container init, which happens automatically for the
      # `services:` container above (fresh volume every run) -- but the
      # GitHub Actions Postgres service image entrypoint does NOT execute our
      # ./infra/postgres/init scripts, since we're not mounting that
      # directory into the service container. Apply the two-role bootstrap
      # explicitly here, against the superuser connection, before migrations
      # try to connect as app_owner/app_user.
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d mercato && break
            echo "waiting for postgres... ($i)"
            sleep 2
          done

      - name: Bootstrap app_owner / app_user roles (infra/postgres/init/00-roles.sql)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -d mercato -v ON_ERROR_STOP=1 -f infra/postgres/init/00-roles.sql

      # The isolation tests expect a migrated schema; they do not migrate
      # themselves. migrate.ts connects with DATABASE_ADMIN_URL (app_owner).
      - name: Migrate
        run: bun run --cwd packages/db migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Includes the RLS and organization isolation tests, which set up
      # tenants via DATABASE_ADMIN_URL (app_owner, BYPASSRLS) on the migrated
      # schema and then query via DATABASE_URL (app_user, RLS-enforced) to
      # assert tenants can never see each other's rows.
      - name: Test
        run: bun run test
